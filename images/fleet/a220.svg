<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <!-- Airbus A220 -->
  <defs>
    <linearGradient id="fuselageA220" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f8f8f8"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
    <linearGradient id="wingA220" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b8b8b8"/>
      <stop offset="100%" style="stop-color:#888888"/>
    </linearGradient>
  </defs>
  <!-- Fuselage - more slender -->
  <ellipse cx="300" cy="150" rx="180" ry="28" fill="url(#fuselageA220)" stroke="#333" stroke-width="2"/>
  <!-- Cockpit -->
  <ellipse cx="120" cy="150" rx="25" ry="25" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <!-- Tail -->
  <polygon points="480,150 520,60 530,150" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  <polygon points="495,100 520,60 525,115" fill="#333"/>
  <!-- Main Wings - shorter for regional -->
  <polygon points="260,150 120,60 105,100 260,150" fill="url(#wingA220)" stroke="#333" stroke-width="2"/>
  <polygon points="260,150 340,60 355,100 260,150" fill="url(#wingA220)" stroke="#333" stroke-width="2"/>
  <!-- Engines -->
  <ellipse cx="180" cy="135" rx="20" ry="12" fill="#555" stroke="#333" stroke-width="2"/>
  <ellipse cx="320" cy="135" rx="20" ry="12" fill="#555" stroke="#333" stroke-width="2"/>
  <!-- Windows -->
  <g fill="#87CEEB">
    <circle cx="160" cy="142" r="2.5"/>
    <circle cx="180" cy="142" r="2.5"/>
    <circle cx="200" cy="142" r="2.5"/>
    <circle cx="220" cy="142" r="2.5"/>
    <circle cx="240" cy="142" r="2.5"/>
    <circle cx="260" cy="142" r="2.5"/>
    <circle cx="280" cy="142" r="2.5"/>
    <circle cx="300" cy="142" r="2.5"/>
    <circle cx="320" cy="142" r="2.5"/>
    <circle cx="340" cy="142" r="2.5"/>
    <circle cx="360" cy="142" r="2.5"/>
  </g>
  <!-- Text -->
  <text x="300" y="250" font-family="Arial" font-size="20" fill="#333" text-anchor="middle">Airbus A220-300</text>
  <text x="300" y="275" font-family="Arial" font-size="14" fill="#666" text-anchor="middle">Regional narrow-body</text>
</svg>